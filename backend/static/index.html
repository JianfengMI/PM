<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Project Management MVP</title>
  </head>
  <body>
    <main>
      <h1>Project Management MVP</h1>
      <p>Backend scaffolding is running.</p>
      <p id="api-status">Checking the API...</p>
    </main>
    <script>
      fetch("/api/hello")
        .then((response) => response.json())
        .then((data) => {
          document.querySelector("#api-status").textContent = data.message;
        });
    </script>
  </body>
</html>
